[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "orchestrated-mcp-agent-platform"
version = "1.0.0"
description = "Orchestrated Multi-MCP AI Agent Platform with LlamaIndex Workflows, FAISS RAG, and dual-tier memory"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.30",
    "faiss-cpu>=1.9.0",
    "mcp>=1.1.0",
    "llama-index-core>=0.12.0",
    "llama-index-workflows>=0.2.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
