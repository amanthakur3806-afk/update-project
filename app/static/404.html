<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Page Not Found | Luna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(15, 23, 42, 0.85);
      --card-border: rgba(99, 102, 241, 0.2);
      --card-border-hover: rgba(99, 102, 241, 0.45);
      --ink: #f8fafc;
      --muted: #94a3b8;
      --faint: #475569;
      --brand: #6366f1;
      --brand-hover: #4f46e5;
      --brand-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --glow: rgba(99, 102, 241, 0.25);
      --code-bg: rgba(30, 41, 59, 0.7);
    }

    [data-theme="light"] {
      --bg: #f1f5f9;
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: rgba(203, 213, 225, 0.8);
      --card-border-hover: rgba(99, 102, 241, 0.4);
      --ink: #0f172a;
      --muted: #64748b;
      --faint: #94a3b8;
      --brand: #6366f1;
      --brand-hover: #4f46e5;
      --glow: rgba(99, 102, 241, 0.15);
      --code-bg: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Ambient background glow */
    .bg-ambient {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--glow) 0%, rgba(99, 102, 241, 0) 70%);
      pointer-events: none;
      z-index: 0;
      filter: blur(40px);
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 620px;
      width: 100%;
      text-align: center;
    }

    /* Brand Header */
    .brand-header {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      text-decoration: none;
      color: var(--ink);
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--brand-gradient);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 4px 14px var(--glow);
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      margin-left: 2px;
    }

    /* Main Card */
    .error-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 48px 36px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: border-color 0.2s ease;
    }

    /* 404 Huge Badge */
    .error-code {
      font-size: 96px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.05em;
      background: var(--brand-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      text-shadow: 0 10px 30px var(--glow);
      user-select: none;
    }

    .error-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
    }

    .error-pill::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: var(--ink);
    }

    .description {
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 24px;
    }

    /* Path Preview */
    .path-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--ink);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 32px;
    }

    .path-box .label {
      color: var(--faint);
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Actions */
    .actions-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    @media (min-width: 480px) {
      .actions-grid {
        flex-direction: row;
        justify-content: center;
      }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--brand-gradient);
      color: #ffffff;
      box-shadow: 0 4px 16px var(--glow);
      border: 1px solid transparent;
    }

    .btn-primary:hover {
      box-shadow: 0 6px 22px rgba(99, 102, 241, 0.4);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--code-bg);
      color: var(--ink);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background: var(--card-border);
      border-color: var(--card-border-hover);
      transform: translateY(-1px);
    }

    /* Footer Navigation */
    .quick-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 16px;
      font-size: 13px;
    }

    .quick-links a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .quick-links a:hover {
      color: var(--brand);
    }

    .quick-links span {
      color: var(--faint);
    }

    /* Theme Toggle */
    .theme-toggle-wrap {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
    }

    .theme-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s ease;
    }

    .theme-btn:hover {
      color: var(--ink);
      border-color: var(--card-border-hover);
    }
  </style>
</head>
<body>

  <div class="bg-ambient"></div>

  <div class="theme-toggle-wrap">
    <button class="theme-btn" id="themeBtn" title="Toggle Theme" type="button">
      <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>
  </div>

  <div class="container">
    <a href="/" class="brand-header">
      <span class="brand-mark">L</span>
      <div>
        <span class="brand-title">Luna</span>
        <span class="brand-subtitle">Autonomous Workspace</span>
      </div>
    </a>

    <div class="error-card">
      <div class="error-code">404</div>
      <div>
        <span class="error-pill">Endpoint Not Found</span>
      </div>
      <h1>Page Not Found</h1>
      <p class="description">
        The requested URL endpoint does not exist on this Luna instance, was removed, or requires different routing.
      </p>

      <div class="path-box">
        <span class="label">Requested Path</span>
        <code id="requestedPath">/</code>
      </div>

      <div class="actions-grid">
        <a href="/" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Return to Chat Workspace
        </a>
        <a href="/docs" class="btn btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          Interactive API Docs
        </a>
      </div>

      <div class="quick-links">
        <a href="/health">System Health</a>
        <span>&bull;</span>
        <a href="/login">Account Sign In</a>
        <span>&bull;</span>
        <a href="javascript:history.back()">Go Back</a>
      </div>
    </div>
  </div>

  <script>
    // Display actual requested path
    try {
      var currentPath = window.location.pathname || "/";
      document.getElementById("requestedPath").textContent = currentPath;
    } catch (e) {}

    // Theme sync with Luna's localStorage
    var savedTheme = localStorage.getItem("luna_theme") || "dark";
    if (savedTheme === "light") {
      document.documentElement.setAttribute("data-theme", "light");
    }

    document.getElementById("themeBtn").addEventListener("click", function () {
      var isLight = document.documentElement.getAttribute("data-theme") === "light";
      var nextTheme = isLight ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", nextTheme);
      localStorage.setItem("luna_theme", nextTheme);
    });
  </script>
</body>
</html>
